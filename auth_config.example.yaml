# Template for auth_config.yaml. Copy this file to auth_config.yaml and
# populate it via `python manage_auth_users.py init` and `... add`. The real
# auth_config.yaml is gitignored — never commit password hashes or the cookie
# key.

cookie:
  name: notice_review_auth
  # Replace with a fresh random hex string (>= 32 chars). `manage_auth_users.py
  # init` generates one for you.
  key: REPLACE_WITH_RANDOM_SECRET
  expiry_days: 30

credentials:
  usernames:
    # Example user — delete this entry once real users are added.
    example_user:
      email: example@example.com
      name: Example User
      # bcrypt hash of the plaintext password. Generate with
      # `python manage_auth_users.py add`.
      password: $2b$12$REPLACE_WITH_BCRYPT_HASH

# Optional: list of emails that may self-register. Empty = no self-registration.
preauthorized:
  emails: []
