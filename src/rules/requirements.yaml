# California Eviction Notice Legal Requirements
# This file defines the legal requirements and validation rules for each notice type

notice_types:
  three_day_pay_or_quit:
    name: "3-Day Notice to Pay Rent or Quit"
    statute: "California Code of Civil Procedure § 1161(2)"
    description: "Notice demanding payment of past-due rent within 3 days or tenant must vacate"

    required_elements:
      - element: "tenant_names"
        description: "Full legal name(s) of all tenants"
        required: true
        statute: "CCP § 1161"

      - element: "property_address"
        description: "Complete address of rental property"
        required: true
        statute: "CCP § 1161"

      - element: "rent_amount"
        description: "Exact dollar amount of rent owed"
        required: true
        statute: "CCP § 1161(2)"
        case_law: "Bevill v. Zoura (1994) 27 Cal.App.4th 694"

      - element: "rental_period"
        description: "Time period for which rent is owed"
        required: true
        statute: "CCP § 1161(2)"

      - element: "payment_address"
        description: "Address where rent payment must be made"
        required: true
        statute: "CCP § 1161(2)"

      - element: "payment_name"
        description: "Name of person/entity to receive payment"
        required: true
        statute: "CCP § 1161(2)"

      - element: "payment_hours"
        description: "Business hours during which payment can be made"
        required: true
        statute: "CCP § 1161(2)"
        case_law: "Schnell v. City of Santa Monica (1978) 81 Cal.App.3d 399"

      - element: "three_day_period"
        description: "Statement that tenant has 3 days to pay or vacate"
        required: true
        statute: "CCP § 1161(2)"

      - element: "landlord_signature"
        description: "Signature of landlord or authorized agent"
        required: true
        statute: "CCP § 1162"

      - element: "date_of_service"
        description: "Date the notice was served"
        required: true
        statute: "CCP § 1162"

    validation_rules:
      - rule_id: "3DP-001"
        name: "rent_only_no_other_charges"
        severity: "critical"
        description: "Notice must demand rent only, not late fees, utilities, or other charges"
        statute: "CCP § 1161(2)"
        case_law:
          - "Canal-Randolph v. Pickell (2003) 106 Cal.App.4th 1141"
          - "Kruger v. Reyes (2014) 232 Cal.App.4th Supp. 10"
        tenant_action: "This defect likely invalidates the notice. Landlord must serve a new notice demanding rent only."
        validation_logic: "Check that all charges listed are explicitly identified as rent. Reject if notice includes late fees, NSF fees, utilities, damages, or other non-rent charges."

      - rule_id: "3DP-002"
        name: "exact_amount_specified"
        severity: "critical"
        description: "Notice must state the exact dollar amount of rent owed"
        statute: "CCP § 1161(2)"
        case_law: "Bevill v. Zoura (1994) 27 Cal.App.4th 694"
        tenant_action: "This defect invalidates the notice. The amount must be clear and unambiguous."
        validation_logic: "Verify a specific dollar amount is stated. Reject vague language like 'all rent due' or 'past due rent'."

      - rule_id: "3DP-003"
        name: "payment_address_required"
        severity: "critical"
        description: "Notice must specify the address where rent payment should be made"
        statute: "CCP § 1161(2)"
        case_law: "Schwab v. Rondel Homes, Inc. (1991) 53 Cal.3d 428"
        tenant_action: "This defect likely invalidates the notice."
        validation_logic: "Check for presence of a physical address for payment. PO Box alone may be insufficient unless previously established."

      - rule_id: "3DP-004"
        name: "payment_person_required"
        severity: "critical"
        description: "Notice must identify the person or entity to whom payment should be made"
        statute: "CCP § 1161(2)"
        tenant_action: "This defect likely invalidates the notice."
        validation_logic: "Verify name of payee is clearly stated."

      - rule_id: "3DP-005"
        name: "payment_hours_required"
        severity: "critical"
        description: "Notice must specify the hours during which payment can be made"
        statute: "CCP § 1161(2)"
        case_law: "Schnell v. City of Santa Monica (1978) 81 Cal.App.3d 399"
        tenant_action: "This defect likely invalidates the notice."
        validation_logic: "Check for business hours or statement like 'during normal business hours 9am-5pm'."

      - rule_id: "3DP-006"
        name: "no_contradictory_demands"
        severity: "critical"
        description: "Notice cannot demand both payment AND possession"
        statute: "CCP § 1161(2)"
        case_law: "Briggs v. Electronic Memories & Magnetics Corp. (1975) 53 Cal.App.3d 900"
        tenant_action: "This defect invalidates the notice. Tenant must be given option to pay OR quit."
        validation_logic: "Ensure notice offers choice: pay rent OR vacate. Reject if it demands immediate possession regardless of payment."

      - rule_id: "3DP-007"
        name: "correct_calculation"
        severity: "critical"
        description: "Rent amount must be accurately calculated"
        statute: "CCP § 1161(2)"
        tenant_action: "If amount is incorrect, notice may be invalid. Check rent records."
        validation_logic: "If rental amount and period are known, verify calculation is correct."

      - rule_id: "3DP-008"
        name: "rental_period_specified"
        severity: "major"
        description: "Notice should specify the time period for which rent is owed"
        statute: "CCP § 1161(2)"
        case_law: "Weber v. Barker (1943) 57 Cal.App.2d 636"
        tenant_action: "Ambiguity may invalidate notice."
        validation_logic: "Check for date range or month(s) for which rent is claimed."

      - rule_id: "3DP-009"
        name: "all_tenants_named"
        severity: "major"
        description: "Notice should name all tenants on the lease"
        statute: "CCP § 1161"
        tenant_action: "If your name is not on the notice and you are on the lease, this may be a defect."
        validation_logic: "Cannot validate automatically - requires lease comparison."

      - rule_id: "3DP-010"
        name: "proper_service_method"
        severity: "critical"
        description: "Notice must be properly served according to CCP § 1162"
        statute: "CCP § 1162"
        tenant_action: "If you were not personally served, or notice was not properly posted and mailed, the service may be defective."
        validation_logic: "Requires proof of service documentation. Check for: (1) personal service, (2) substituted service with subsequent mailing, or (3) posting and mailing if others unavailable."

  three_day_cure_or_quit:
    name: "3-Day Notice to Cure or Quit"
    statute: "California Code of Civil Procedure § 1161(3)"
    description: "Notice demanding tenant cure a lease violation within 3 days or vacate"

    required_elements:
      - element: "tenant_names"
        description: "Full legal name(s) of all tenants"
        required: true
        statute: "CCP § 1161"

      - element: "property_address"
        description: "Complete address of rental property"
        required: true
        statute: "CCP § 1161"

      - element: "lease_violation"
        description: "Specific description of lease violation"
        required: true
        statute: "CCP § 1161(3)"

      - element: "cure_requirements"
        description: "Clear statement of what tenant must do to cure"
        required: true
        statute: "CCP § 1161(3)"

      - element: "three_day_period"
        description: "Statement that tenant has 3 days to cure or vacate"
        required: true
        statute: "CCP § 1161(3)"

      - element: "lease_reference"
        description: "Reference to specific lease provision violated"
        required: true
        statute: "CCP § 1161(3)"

    validation_rules:
      - rule_id: "3DC-001"
        name: "specific_violation_described"
        severity: "critical"
        description: "Notice must specifically describe the lease violation"
        statute: "CCP § 1161(3)"
        case_law: "Kwok v. Bergren (1982) 130 Cal.App.3d 596"
        tenant_action: "Vague or general allegations may invalidate the notice."
        validation_logic: "Reject vague statements. Must include specific facts about the violation."

      - rule_id: "3DC-002"
        name: "violation_must_be_curable"
        severity: "critical"
        description: "Violation cited must be something tenant can actually cure"
        statute: "CCP § 1161(3)"
        tenant_action: "If the violation cannot be cured, this notice type is improper."
        validation_logic: "Some violations (like getting a pet when lease prohibits pets) are arguably curable. Others (like committing a crime) are not."

      - rule_id: "3DC-003"
        name: "lease_clause_referenced"
        severity: "major"
        description: "Notice should reference the specific lease provision violated"
        statute: "CCP § 1161(3)"
        tenant_action: "Without reference to lease terms, notice may be defective."
        validation_logic: "Check for lease section number or quoted lease language."

      - rule_id: "3DC-004"
        name: "cure_method_clear"
        severity: "major"
        description: "Notice should clearly state what tenant must do to cure"
        statute: "CCP § 1161(3)"
        tenant_action: "Ambiguous cure requirements may invalidate notice."
        validation_logic: "Must specify action required, not just state 'cure the violation'."

  three_day_unconditional_quit:
    name: "3-Day Unconditional Notice to Quit"
    statute: "California Code of Civil Procedure § 1161(4)"
    description: "Notice requiring tenant to vacate within 3 days with no opportunity to cure"

    required_elements:
      - element: "tenant_names"
        description: "Full legal name(s) of all tenants"
        required: true
        statute: "CCP § 1161"

      - element: "property_address"
        description: "Complete address of rental property"
        required: true
        statute: "CCP § 1161"

      - element: "qualifying_violation"
        description: "Specific description of qualifying serious violation"
        required: true
        statute: "CCP § 1161(4)"

      - element: "three_day_period"
        description: "Statement that tenant has 3 days to vacate"
        required: true
        statute: "CCP § 1161(4)"

    validation_rules:
      - rule_id: "3DU-001"
        name: "qualifying_violation_required"
        severity: "critical"
        description: "Unconditional quit notice only valid for specific serious violations"
        statute: "CCP § 1161(4)"
        case_law: "Gross v. Superior Court (1985) 171 Cal.App.3d 265"
        tenant_action: "This notice type requires assignation, subletting, waste, nuisance, illegal use, or repeat violations after written notice. If your situation doesn't fit these categories, the notice may be invalid."
        validation_logic: "Notice must allege one of: (1) assignment/subletting, (2) nuisance, (3) waste, (4) illegal use of premises. Verify specific facts supporting the allegation."

      - rule_id: "3DU-002"
        name: "sufficient_detail_provided"
        severity: "critical"
        description: "Notice must provide sufficient detail about the violation"
        statute: "CCP § 1161(4)"
        tenant_action: "Vague or conclusory allegations may invalidate the notice."
        validation_logic: "Must include specific facts and dates, not just legal conclusions."

  thirty_day_notice:
    name: "30-Day Notice to Terminate Tenancy"
    statute: "California Civil Code § 1946"
    description: "No-cause termination notice for month-to-month tenancies under 1 year"

    required_elements:
      - element: "tenant_names"
        description: "Full legal name(s) of all tenants"
        required: true
        statute: "CC § 1946"

      - element: "property_address"
        description: "Complete address of rental property"
        required: true
        statute: "CC § 1946"

      - element: "termination_date"
        description: "Date tenancy will terminate (at least 30 days from service)"
        required: true
        statute: "CC § 1946"

      - element: "just_cause_statement"
        description: "Statement of just cause for termination (if AB 1482 applies)"
        required: false  # Depends on property and situation
        statute: "CC § 1946.2 (AB 1482)"
        notes: "Required for properties covered by Tenant Protection Act unless exempt"

    validation_rules:
      - rule_id: "30D-001"
        name: "correct_notice_period"
        severity: "critical"
        description: "30-day notice only valid if tenant occupied less than 1 year"
        statute: "CC § 1946.1"
        tenant_action: "If you have lived there 1 year or more, landlord must give 60-day notice."
        validation_logic: "If tenancy length is 1+ years, this notice type is invalid. Should be 60-day."

      - rule_id: "30D-002"
        name: "proper_termination_date"
        severity: "critical"
        description: "Termination date must be at least 30 days from service"
        statute: "CC § 1946"
        tenant_action: "If notice period is less than 30 days, notice is defective."
        validation_logic: "Calculate days between service date and termination date. Must be ≥30 days."

      - rule_id: "30D-003"
        name: "termination_on_rent_due_date"
        severity: "minor"
        description: "For periodic tenancies, termination should be on rent due date"
        statute: "CC § 1946"
        case_law: "Drouet v. Superior Court (2003) 31 Cal.4th 583"
        tenant_action: "If termination date is mid-month, you may only owe prorated rent."
        validation_logic: "Check if termination date aligns with rental period end."

      - rule_id: "30D-004"
        name: "ab1482_just_cause_required"
        severity: "critical"
        description: "Properties covered by AB 1482 require just cause statement"
        statute: "CC § 1946.2"
        tenant_action: "If property is covered by Tenant Protection Act and no just cause is stated, notice is invalid."
        validation_logic: "Determine if property is AB 1482 covered. If yes, notice must state a valid just cause reason (at-fault or no-fault with proper notice)."
        notes: "Exemptions: Properties built within 15 years, single-family homes (if certain conditions met), duplexes where owner occupies one unit."

      - rule_id: "30D-005"
        name: "relocation_assistance_notice"
        severity: "critical"
        description: "No-fault terminations under AB 1482 require relocation assistance"
        statute: "CC § 1946.2(d)(2)"
        tenant_action: "If this is a no-fault eviction under AB 1482, you may be entitled to relocation assistance equal to one month's rent."
        validation_logic: "If AB 1482 applies and reason is no-fault (owner move-in, substantial remodel, etc.), check if notice mentions relocation assistance."

  sixty_day_notice:
    name: "60-Day Notice to Terminate Tenancy"
    statute: "California Civil Code § 1946.1"
    description: "No-cause termination notice for month-to-month tenancies of 1 year or more"

    required_elements:
      - element: "tenant_names"
        description: "Full legal name(s) of all tenants"
        required: true
        statute: "CC § 1946.1"

      - element: "property_address"
        description: "Complete address of rental property"
        required: true
        statute: "CC § 1946.1"

      - element: "termination_date"
        description: "Date tenancy will terminate (at least 60 days from service)"
        required: true
        statute: "CC § 1946.1"

      - element: "just_cause_statement"
        description: "Statement of just cause for termination (if AB 1482 applies)"
        required: false
        statute: "CC § 1946.2 (AB 1482)"

    validation_rules:
      - rule_id: "60D-001"
        name: "tenancy_one_year_or_more"
        severity: "critical"
        description: "60-day notice required only if tenant occupied 1 year or more"
        statute: "CC § 1946.1"
        tenant_action: "Verify your tenancy length. If less than 1 year, 30-day notice is sufficient."
        validation_logic: "60-day notice is required for tenancies of 1+ years. Using 60-day when 30-day is sufficient is not a defect, but using 30-day when 60-day required IS a defect."

      - rule_id: "60D-002"
        name: "proper_termination_date"
        severity: "critical"
        description: "Termination date must be at least 60 days from service"
        statute: "CC § 1946.1"
        tenant_action: "If notice period is less than 60 days, notice is defective."
        validation_logic: "Calculate days between service date and termination date. Must be ≥60 days."

      - rule_id: "60D-003"
        name: "ab1482_just_cause_required"
        severity: "critical"
        description: "Properties covered by AB 1482 require just cause statement"
        statute: "CC § 1946.2"
        tenant_action: "If property is covered by Tenant Protection Act and no just cause is stated, notice is invalid."
        validation_logic: "Same as 30D-004. Check AB 1482 coverage and require just cause statement."

      - rule_id: "60D-004"
        name: "relocation_assistance_notice"
        severity: "critical"
        description: "No-fault terminations under AB 1482 require relocation assistance"
        statute: "CC § 1946.2(d)(2)"
        tenant_action: "If this is a no-fault eviction under AB 1482, you are entitled to relocation assistance equal to one month's rent."
        validation_logic: "Same as 30D-005."

# Common validation rules that apply across multiple notice types
common_rules:
  - rule_id: "COM-001"
    name: "tenant_name_present"
    severity: "major"
    description: "Notice must include tenant name(s)"
    statute: "CCP § 1161"
    tenant_action: "If your name is missing from notice, it may be defective."
    applies_to: ["all"]

  - rule_id: "COM-002"
    name: "property_address_present"
    severity: "major"
    description: "Notice must include complete property address"
    statute: "CCP § 1161"
    tenant_action: "Missing or incomplete address may invalidate notice."
    applies_to: ["all"]

  - rule_id: "COM-003"
    name: "signature_present"
    severity: "major"
    description: "Notice must be signed by landlord or authorized agent"
    statute: "CCP § 1162"
    tenant_action: "Unsigned notice may be defective."
    applies_to: ["all"]

  - rule_id: "COM-004"
    name: "date_present"
    severity: "major"
    description: "Notice should include date of service"
    statute: "CCP § 1162"
    tenant_action: "Missing date makes it difficult to calculate notice period."
    applies_to: ["all"]

  - rule_id: "COM-005"
    name: "clear_unambiguous_language"
    severity: "major"
    description: "Notice language must be clear and unambiguous"
    case_law: "Liebovich v. Shahrokhkhany (1997) 56 Cal.App.4th 511"
    tenant_action: "If notice is confusing or contradictory, it may be invalid."
    applies_to: ["all"]
    validation_logic: "Use LLM to detect ambiguous, contradictory, or confusing language."

  - rule_id: "COM-006"
    name: "proper_service_documented"
    severity: "critical"
    description: "Proof of service must comply with CCP § 1162"
    statute: "CCP § 1162"
    tenant_action: "Check proof of service for proper service method and details."
    applies_to: ["all"]
    validation_logic: "Service methods: (1) Personal delivery to tenant, (2) Substituted service (leave with person of suitable age + mail copy), (3) Post and mail if no one available. Each requires specific documentation."

# AB 1482 (Tenant Protection Act of 2019) - Special Considerations
ab1482_requirements:
  applies_to:
    description: "Most residential properties in California except certain exemptions"
    exemptions:
      - "Properties built within 15 years of notice"
      - "Single-family homes where owner is not a corporation/LLC/REIT (must provide notice of exemption)"
      - "Duplexes where owner occupies one unit as primary residence"
      - "Certain affordable housing"
      - "Dormitories, hospitals, some non-profits"
    statute: "CC § 1946.2(e)"

  just_cause_categories:
    at_fault_reasons:
      - "Nonpayment of rent"
      - "Breach of material lease term"
      - "Nuisance, waste, or illegal activity"
      - "Criminal activity on premises"
      - "Refusal to sign lease renewal with similar terms"
      - "Unapproved sublease or assignment"
      - "Refusal of access as required by law"

    no_fault_reasons:
      - "Owner move-in (owner or immediate family)"
      - "Withdrawal from rental market"
      - "Demolition or substantial remodel"
      - "Compliance with government order"

  relocation_assistance:
    amount: "One month's rent"
    when_required: "All no-fault terminations under AB 1482"
    alternative: "Owner may allow tenant to remain an additional month rent-free instead of cash payment"
    statute: "CC § 1946.2(d)(2)"
    tenant_action: "For no-fault evictions, landlord must pay relocation assistance or provide waiver form allowing you one free month."

# Service of Notice Requirements (CCP § 1162)
service_requirements:
  methods:
    personal_service:
      description: "Hand delivery directly to the tenant"
      proof_required: "Declaration stating date, time, location, and person served"
      preferred: true

    substituted_service:
      description: "Leave with person of suitable age/discretion at tenant's residence or business, AND mail copy"
      requirements:
        - "Person must be of suitable age and discretion"
        - "Copy must be mailed same day to tenant's address"
        - "Both steps are required"
      proof_required: "Declaration with details of both delivery and mailing"

    post_and_mail:
      description: "Post notice in conspicuous place on property AND mail copy"
      when_allowed: "Only if personal and substituted service are not possible"
      requirements:
        - "Must post in conspicuous place (usually front door)"
        - "Must mail copy same day to tenant's address"
        - "Must provide reason why other methods not possible"
      proof_required: "Declaration with details of both posting and mailing, and reason for using this method"

  timing:
    calculation: "Day of service is not counted. Start counting the next day."
    weekends_holidays: "If final day falls on weekend or holiday, deadline extends to next business day"
    statute: "Code of Civil Procedure § 12, § 12a"
